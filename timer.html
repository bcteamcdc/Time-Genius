    <div class="container">
        <h1>TASK TIMER</h1>
        <p id="timer-display">00:00:00</p>
        <div class="buttons">
            <button id="start-timer" class="btn btn-primary">Start</button>
            <button id="pause-timer" class="btn btn-warning">Pause</button>
            <button id="reset-timer" class="btn btn-danger">Reset</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const hours = parseInt(urlParams.get('hours'), 10) || 0;
            const minutes = parseInt(urlParams.get('minutes'), 10) || 0;
            let totalSeconds = (hours * 60 + minutes) * 60;
            let interval;
            let isPaused = false;

            const timerDisplay = document.getElementById('timer-display');
            const startButton = document.getElementById('start-timer');
            const pauseButton = document.getElementById('pause-timer');
            const resetButton = document.getElementById('reset-timer');

            function updateTimerDisplay() {
                const displayHours = Math.floor(totalSeconds / 3600);
                const displayMinutes = Math.floor((totalSeconds % 3600) / 60);
                const displaySeconds = totalSeconds % 60;
                timerDisplay.textContent = `${String(displayHours).padStart(2, '0')}:${String(displayMinutes).padStart(2, '0')}:${String(displaySeconds).padStart(2, '0')}`;
            }

            function startTimer() {
                if (interval) clearInterval(interval);
                isPaused = false;
                interval = setInterval(() => {
                    if (!isPaused && totalSeconds > 0) {
                        totalSeconds--;
                        updateTimerDisplay();
                    } else if (totalSeconds === 0) {
                        clearInterval(interval);
                        alert('Your Learning Time Is End');
                        playTone();
                    }
                }, 1000);
            }

            function pauseTimer() {
                isPaused = !isPaused;
                pauseButton.textContent = isPaused ? 'Resume' : 'Pause';
            }

            function resetTimer() {
                const confirmReset = confirm('Are you sure you want to reset the timer?');
                if (confirmReset) {
                    if (interval) clearInterval(interval);
                    totalSeconds = (hours * 60 + minutes) * 60;
                    updateTimerDisplay();
                    isPaused = false;
                    pauseButton.textContent = 'Pause';
                }
            }

            function playTone() {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
                oscillator.connect(audioContext.destination);
                oscillator.start();
                setTimeout(() => {
                    oscillator.stop();
                    audioContext.close();
                }, 2000);
            }

            startButton.addEventListener('click', startTimer);
            pauseButton.addEventListener('click', pauseTimer);
            resetButton.addEventListener('click', resetTimer);

            updateTimerDisplay();
        });
    </script>
</body>
