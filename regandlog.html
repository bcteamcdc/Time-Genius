<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Genius - Registration and Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-brand { animation: fadeIn 2s ease-in-out; }
        .navbar-nav .nav-link { transition: color 0.3s ease-in-out, transform 0.3s ease-in-out; animation: fadeIn 2s ease-in-out; }
        .navbar-nav .nav-link:hover { color: #ffcc00; transform: scale(1.1); }
        .container {
            max-width: 900px;
            margin: auto;
        }
        .form-container {
            display: flex;
            flex-wrap: wrap;
        }
        .form-card {
            flex: 1 1 50%;
            padding: 20px;
            box-sizing: border-box;
            animation: fadeInUp 1s ease-in-out;
        }
        .toggle-buttons {
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            animation: fadeInUp 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div id="user_registration" class="section active">
            <h2>User Registration and Login</h2>
            <p><center>To access all the features of our Time Management App, please register or log in.</center></p>
            
            <div class="toggle-buttons">
                <button id="signUp" class="btn btn-outline-primary">Register</button>
                <button id="signIn" class="btn btn-outline-secondary">Login</button>
            </div>
            
            <div class="form-container">
                <!-- Registration Form -->
                <div class="card form-card" id="registrationCard">
                    <div class="card-header">Register</div>
                    <div class="card-body">
                        <form id="registrationForm">
                            <div class="form-group">
                                <label for="regUsername">Username</label>
                                <input type="text" class="form-control" id="regUsername" required>
                            </div>
                            <div class="form-group">
                                <label for="regPassword">Password</label>
                                <input type="password" class="form-control" id="regPassword" required>
                            </div>
                            <div class="form-group">
                                <label for="regConfirmPassword">Confirm Password</label>
                                <input type="password" class="form-control" id="regConfirmPassword" required>
                            </div>
                            <div class="form-group">
                                <label for="regEmail">Email</label>
                                <input type="email" class="form-control" id="regEmail" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Register</button>
                        </form>
                    </div>
                </div>

                <!-- Login Form -->
                <div class="card form-card hidden" id="loginCard">
                    <div class="card-header">Login</div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="form-group">
                                <label for="loginUsername">Username</label>
                                <input type="text" class="form-control" id="loginUsername" required>
                            </div>
                            <div class="form-group">
                                <label for="loginPassword">Password</label>
                                <input type="password" class="form-control" id="loginPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="text-center bg-dark text-white py-3 mt-5">
        <b>&copy; 2024 Coding Club Bandaranayake College Gampaha</b>
    </footer>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const signUpButton = document.getElementById('signUp');
            const signInButton = document.getElementById('signIn');
            const registrationCard = document.getElementById('registrationCard');
            const loginCard = document.getElementById('loginCard');

            signUpButton.addEventListener('click', () => {
                registrationCard.classList.remove('hidden');
                loginCard.classList.add('hidden');
            });

            signInButton.addEventListener('click', () => {
                registrationCard.classList.add('hidden');
                loginCard.classList.remove('hidden');
            });

            const registrationForm = document.getElementById('registrationForm');
            const loginForm = document.getElementById('loginForm');

            registrationForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('regUsername').value;
                const password = document.getElementById('regPassword').value;
                const confirmPassword = document.getElementById('regConfirmPassword').value;
                const email = document.getElementById('regEmail').value;

                if (password !== confirmPassword) {
                    alert('Passwords do not match');
                    return;
                }

                const response = await fetch('https://electric-bernardina-vishwa223-722ebb55.koyeb.app/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email })
                });

                const data = await response.json();
                if (response.ok) {
                    alert('Registration successful!');
                    registrationForm.reset();
                    window.location.href = 'getstart.html';
                } else {
                    alert(data.error);
                }
            });

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('loginUsername').value;
                const password = document.getElementById('loginPassword').value;

                const response = await fetch('https://electric-bernardina-vishwa223-722ebb55.koyeb.app/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('email', data.email);
                    alert('Login successful!');
                    window.location.href = 'getstart.html';
                } else {
                    alert(data.message);
                }
            });
        });
    </script>
</body>
</html>
